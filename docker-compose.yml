services:
  db:
    image: postgres:16
    container_name: sgv_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sgv_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: sgv_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sgv.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - sgv_network

volumes:
  postgres_data:

networks:
  sgv_network:
    driver: bridge